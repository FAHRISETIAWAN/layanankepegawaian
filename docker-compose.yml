version: '3.9'

services:
  be:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: ipg-be
    restart: unless-stopped
    expose:
      - '3001'
    env_file:
      - ./BE/.env
    volumes:
      - be_uploads:/app/uploads

  fe:
    build:
      context: ./FE
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://itms.atrbpn.go.id/layanankepegawaian/api
    container_name: ipg-fe
    restart: unless-stopped
    expose:
      - '3000'
    env_file:
      - ./FE/.env.production
    environment:
      - BE_URL=http://be:3001/api
    depends_on:
      - be

  nginx:
    image: nginx:alpine
    container_name: ipg-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - fe
      - be

  certbot:
    image: certbot/certbot
    container_name: ipg-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  be_uploads:
