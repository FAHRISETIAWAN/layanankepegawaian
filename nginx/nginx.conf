# ─── HTTP: redirect ke HTTPS + Certbot challenge ─────────────────────────────
server {
    listen 80;
    server_name itms.atrbpn.go.id;

    # Certbot challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect semua HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name itms.atrbpn.go.id;

    ssl_certificate     /etc/letsencrypt/live/itms.atrbpn.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itms.atrbpn.go.id/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ─── FE: /layanankepegawaian ──────────────────────────────────────────────
    location /layanankepegawaian {
        proxy_pass         http://fe:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── BE API: /be → be:3001 (strip /be prefix) ────────────────────────────
    location /be {
        rewrite ^/be(/.*)$ $1 break;
        proxy_pass         http://be:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Root redirect ────────────────────────────────────────────────────────
    location = / {
        return 301 /layanankepegawaian;
    }
}
